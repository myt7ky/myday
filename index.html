<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой день</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#5b5bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мой день">
</head><body><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;color:#6b7280">Загрузка «Мой день»…</div>
<script>
(async()=>{
  const parts=["./app/full-01.html","./app/full-02.html","./app/full-03.html","./app/full-04.html","./app/full-05.html"];
  try{
    const xs=await Promise.all(parts.map(x=>fetch(x+"?v=11",{cache:"reload"})));
    if(xs.some(x=>!x.ok)) throw new Error("Не удалось загрузить приложение");
    const html=(await Promise.all(xs.map(x=>x.text()))).join("");
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML="<div style=\"padding:24px;font-family:system-ui\"><h2>Ошибка загрузки</h2><p>Обновите страницу ещё раз.</p></div>";
  }
})();
</script></body></html>
