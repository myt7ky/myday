<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мой день</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#5b5bd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мой день">
</head><body><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;color:#6b7280">Загрузка «Мой день»…</div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  const parts=["./app/app.html"];
  const v="25";
  try{
    const xs=await Promise.all(parts.map(x=>fetch(x+"?v="+v,{cache:"no-store"})));
    for(let i=0;i<xs.length;i++) if(!xs[i].ok) throw new Error("Не загрузился модуль "+parts[i]);
    const html=(await Promise.all(xs.map(x=>x.text()))).join("");
    if(!html.includes('id="nav"')||!html.includes('id="t-ov"')) throw new Error("Модули приложения повреждены");
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML="<div style=\"padding:24px;font-family:system-ui\"><h2>Ошибка загрузки</h2><p>"+String(e.message||e)+"</p><button onclick=\"location.reload()\">Повторить</button></div>";
  }
})();
</script></body></html>
