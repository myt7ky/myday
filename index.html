<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyDay</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyDay">
</head><body><div style="min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;color:#6b7280">Загрузка «MyDay»…</div>
<script>
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.MyDayInstallPrompt=e});
(async()=>{
  const part="./app/app.html",v="75";
  try{if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){}
  try{
    const r=await fetch(part+"?v="+v,{cache:"no-store"});
    if(!r.ok)throw new Error("Не загрузился модуль "+part);
    const html=await r.text();
    if(!html.includes('id="nav"')||!html.includes('id="t-ov"'))throw new Error("Модуль приложения повреждён");
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML="<div style=\"padding:24px;font-family:system-ui\"><h2>Нет связи</h2><p>Не удалось загрузить приложение: "+String(e.message||e).replace(/[<>&]/g,"")+".</p><p>Откройте его один раз с интернетом — после этого оно будет работать офлайн.</p><button onclick=\"location.reload()\">Повторить</button></div>";
  }
})();
</script></body></html>
