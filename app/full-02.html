/* Standalone Claude API bridge. The API key stays on the server. */
window.MYDAY_AI_ENDPOINT=window.MYDAY_AI_ENDPOINT||localStorage.getItem('myday-ai-endpoint')||'/api/ai';
async function mydayClaudeRequest(prompt){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),90000);
  try{
    const r=await fetch(window.MYDAY_AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt}),signal:controller.signal});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){const e=new Error(d.error||'Ошибка Claude API');e.code=d.code||'api_error';throw e}
    return String(d.text||'').trim();
  }catch(e){
    if(e.name==='AbortError')e.code='timeout';
    throw e;
  }finally{clearTimeout(timer)}
}
function mydayParseJSON(text){
  let s=String(text||'').trim().replace(/^\`\`\`(?:json)?\s*/i,'').replace(/\s*\`\`\`$/,'').trim();
  try{return JSON.parse(s)}catch(e){}
  const a=Math.min(...[s.indexOf('{'),s.indexOf('[')].filter(x=>x>=0));
  const b=Math.max(s.lastIndexOf('}'),s.lastIndexOf(']'));
  if(a>=0&&b>a){try{return JSON.parse(s.slice(a,b+1))}catch(e){}}
  throw Object.assign(new Error('Claude вернул невалидный JSON'),{code:'invalid_json'});
}
const mydaySample=async prompt=>({text:await mydayClaudeRequest(prompt)});
mydaySample.json=async prompt=>mydayParseJSON(await mydayClaudeRequest(prompt));

    }};
    return null;
  }
};

  // chart

  // categories
  const by={};S.items.forEach(i=>by[i.cat]=(by[i.cat]||0)+i.amount);const K=$('cats');K.innerHTML='';
  if(!tot)K.appendChild(el('div','empty','Нет данных'));

}

/* CSV */
const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
const safe=v=>/^[=+\-@\t]/.test(v)?"'"+v:v;
$('exp').onclick=async()=>{
  if(!S.items.length){toast('Нет данных для экспорта');return}
  const rows=[['дата','название','сумма','валюта','категория','оценка','зачем']];
  [...S.items].sort((a,b)=>a.date.localeCompare(b.date)).forEach(i=>rows.push([i.date,safe(i.name),i.amount,S.cur,i.cat,i.feel,safe(i.why||'')]));
  const csv='\uFEFF'+rows.map(r=>r.map(q).join(';')).join('\r\n');
  try{if(await saveFile('spending-'+today()+'.csv',csv))toast('Файл сохранён')}catch(e){if(!e||e.code!=='declined')toast('Не удалось сохранить файл')}
};
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const h=t.split(/\r?\n/)[0],d=h.split(';').length>=h.split(',').length?';':',';
  const rows=[];let r=[],f='',inq=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inq){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else inq=false}else f+=c}
    else if(c==='"')inq=true;else if(c===d){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x!==''))rows.push(r);r=[]}else f+=c}
  r.push(f);if(r.some(x=>x!==''))rows.push(r);return rows}
