<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#5b5bd6">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мой день"><title>Мой день — личный трекер</title><style>
:root{--bg:#f4f6f8;--panel:#ffffff;--panel2:#f8fafc;--text:#111827;--muted:#6b7280;--accent:#5b5bd6;--good:#16a34a;--mid:#d97706;--bad:#dc2626;--border:#e5e7eb;--shadow:0 18px 50px rgba(15,23,42,.07)}
:root[data-theme="dark"]{--bg:#0d1117;--panel:#151a21;--panel2:#10151b;--text:#eef2f7;--muted:#9aa4b2;--accent:#8b86ff;--good:#34d399;--mid:#fbbf24;--bad:#fb7185;--border:#2a3441;--shadow:0 18px 50px rgba(0,0,0,.26)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}button,input,select{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:244px minmax(0,1fr)}
.sidebar{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;gap:18px}.brand{padding:5px 10px 3px}.brand .mark{font-size:24px}.brand h1{font-size:18px;margin:7px 0 3px;letter-spacing:-.02em}.brand p{margin:0;color:var(--muted);font-size:12px}
#nav{display:flex;flex-direction:column;gap:4px;min-height:0}#nav button{width:100%;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left;font-weight:650;transition:.18s}#nav button:hover{background:var(--panel2);color:var(--text)}#nav button.on{background:rgba(91,91,214,.12);color:var(--accent)}
.side-actions{margin-top:auto;display:grid;gap:8px}.side-actions .small-action{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:10px 12px;border-radius:12px;text-align:left}
.workspace{min-width:0}header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}.topbar{min-height:74px;max-width:1180px;margin:auto;padding:14px 26px;display:flex;align-items:center;gap:16px}.page-title{min-width:180px}.page-title .eyebrow,.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}.page-title h2{font-size:22px;margin:4px 0 0;letter-spacing:-.03em}.top-spacer{flex:1}.search-launch{width:min(340px,36vw);position:relative}.search-launch button{width:100%;padding:10px 12px 10px 38px;border:1px solid var(--border);background:var(--panel);color:var(--muted);border-radius:13px;text-align:left}.search-launch:before{content:'⌕';position:absolute;left:13px;top:7px;font-size:19px;color:var(--muted);z-index:1}.sync-pill{font-size:12px;color:var(--muted);padding:8px 10px;border-radius:12px;background:var(--panel)}
#subnav{display:flex;gap:6px;max-width:1180px;margin:0 auto;padding:0 26px 12px;overflow-x:auto}#subnav button{border:1px solid var(--border);background:var(--panel);color:var(--muted);padding:7px 12px;border-radius:999px;white-space:nowrap}#subnav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1180px;margin:0 auto;padding:26px 26px 70px}section{display:none}section.on{display:block}
.today-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:26px;border-radius:24px;margin-bottom:16px;background:linear-gradient(135deg,rgba(91,91,214,.15),rgba(124,58,237,.08) 48%,var(--panel) 100%);border:1px solid var(--border);box-shadow:var(--shadow)}.today-hero h2{margin:5px 0 6px;font-size:28px;letter-spacing:-.04em}.today-hero p{margin:0;color:var(--muted)}.hero-actions{display:grid;grid-template-columns:repeat(2,minmax(130px,1fr));gap:8px;min-width:280px}.quick{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:650}.quick:hover{border-color:var(--accent);color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 5px 18px rgba(15,23,42,.025)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}.grid .card{margin:0}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}.tile{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:14px}.tile b{display:block;font-size:22px;margin-top:2px;letter-spacing:-.02em}h2{font-size:16px;margin:0 0 10px;letter-spacing:-.02em}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.fg .f2{grid-column:span 2}label{display:block;font-size:12px;color:var(--muted)}input,select{width:100%;margin-top:5px;padding:11px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text);outline:none}input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,214,.12)}.btn{padding:11px 16px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}.btn.sec{background:transparent;color:var(--accent);border:1px solid var(--accent)}.btn.dng{background:transparent;color:var(--bad);border:1px solid var(--bad)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.muted,.meta{color:var(--muted);font-size:13px}.bad{color:var(--bad)}.mid{color:var(--mid)}.good{color:var(--good)}
.prog{height:12px;background:var(--border);border-radius:8px;overflow:hidden;margin:10px 0 6px}.prog i{display:block;height:100%;background:var(--good)}.prog i.warn{background:var(--mid)}.prog i.over{background:var(--bad)}.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text)}.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart{display:flex;align-items:flex-end;gap:6px;height:160px}.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}.col .b{width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}.col .b.over{background:var(--bad)}.col .n,.col .x{font-size:11px;color:var(--muted);white-space:nowrap}.col .n{margin-bottom:3px}.col .x{margin-top:4px}.bar{display:flex;align-items:center;gap:8px;font-size:14px;margin:7px 0}.bar .l{width:120px;flex:none}.bar .t{flex:1;background:var(--border);border-radius:6px;height:10px;overflow:hidden}.bar .t i{display:block;height:100%;background:var(--accent)}.bar .v{width:90px;text-align:right;flex:none;color:var(--muted)}
.it{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.it:last-child{border:0}.it .nm{font-weight:650;word-break:break-word}.it .r{text-align:right;flex:none}.it .amt{font-weight:750}.ed{background:none;border:0;color:var(--accent);font-size:13px;padding:4px 0}.badge{display:inline-block;font-size:12px;font-weight:650;padding:1px 8px;border-radius:99px;border:1px solid currentColor;margin-left:6px}.an p{margin:5px 0;font-size:14px}.flt{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-bottom:8px}
.settings-card{border-color:rgba(91,91,214,.25);background:linear-gradient(180deg,var(--panel),var(--panel2))}.settings-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.settings-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:12px;background:rgba(91,91,214,.11)}.empty{text-align:center;color:var(--muted);padding:24px 0}.rem{border-color:var(--bad)}
#modal{position:fixed;inset:0;background:rgba(2,6,23,.58);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}#modal.on{display:flex}#modal .card{width:100%;max-width:520px;max-height:90%;overflow:auto;margin:0}#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:50;max-width:90%}
.search-overlay{position:fixed;inset:0;background:rgba(2,6,23,.56);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 20px;z-index:60}.search-overlay.on{display:flex}.search-dialog{width:min(720px,100%);background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.24);padding:16px}.search-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.icon-btn{border:0;background:transparent;color:var(--muted);font-size:18px}.search-input{font-size:16px;margin:0}.search-results{max-height:58vh;overflow:auto;margin-top:10px}.result{padding:12px;border:1px solid var(--border);border-radius:14px;margin-bottom:8px;background:var(--panel2)}.result strong{display:block}.result span{color:var(--muted);font-size:12px}
@media(max-width:920px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-260px;z-index:30;width:244px;transition:.22s;box-shadow:20px 0 50px rgba(0,0,0,.18)}body.nav-open .sidebar{left:0}.mobile-menu{display:block}.grid{grid-template-columns:1fr}.topbar{padding:12px 16px}#subnav{padding:0 16px 10px}main{padding:18px 16px 88px}.search-launch{width:auto;flex:1}}.mobile-menu{display:none;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 11px}
@media(max-width:620px){.today-hero{display:block;padding:20px}.today-hero h2{font-size:24px}.hero-actions{margin-top:16px;min-width:0}.top-spacer,.sync-pill{display:none}.flt{grid-template-columns:1fr}.fg .f2{grid-column:1/-1}}
</style></head><body>
